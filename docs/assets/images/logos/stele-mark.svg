    <line x1="30" y1="58" x2="54" y2="58" stroke-width="2"/>
    <line x1="30" y1="72" x2="54" y2="72" stroke-width="2"/>
    <line x1="30" y1="86" x2="54" y2="86" stroke-width="2"/>
    <line x1="56" y1="44" x2="56" y2="86" stroke-width="2"/>
