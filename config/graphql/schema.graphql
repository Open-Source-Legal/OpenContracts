- Non-structural annotations visible if public OR owned by user
"""
type SemanticSearchResultType {
  """The matched annotation"""
  annotation: AnnotationType!

  """Similarity score (0.0-1.0, higher is more similar)"""
  similarityScore: Float!

  """
  Smallest enclosing OC_SUBTREE_GROUP subtree for this hit, or null when the annotation has no materialised containing block (root structural rows, legacy documents).
  """
  blockContext: BlockContextType

  """The document containing this annotation (for convenience)"""
  document: DocumentType

  """The corpus containing this annotation, if any"""
  corpus: CorpusType
}

"""
The smallest enclosing ``OC_SUBTREE_GROUP`` block for a vector hit.

Lets clients deep-link directly to the materialised subtree relationship
(``Relationship.id``) instead of recursively walking ``parent_id`` —
used by the document viewer's "jump to surfaced block" affordance.
"""
type BlockContextType {
  """
  Database PK of the OC_SUBTREE_GROUP relationship. NOTE: this is the raw Django PK (matching ``Relationship.id``), NOT a global Relay ID — frontend deep-links pass it through directly.
  """
  relationshipId: ID!

  """
  PK of the ancestor annotation that anchors this block. Useful for highlighting the block root in the document viewer.
  """
  sourceAnnotationId: ID!

  """
  Raw text of the ancestor annotation. May be empty for image-only structural rows; clients should treat empty as valid rather than missing.
  """
  sourceText: String!

  """
  PKs of every annotation transitively under the block source — i.e. the descendants the document viewer should also highlight when jumping to this block.
  """
  targetAnnotationIds: [ID!]!

  """
  Source + targets concatenated newline-separated, capped at ``SUBTREE_GROUP_BLOCK_TEXT_MAX_CHARS`` characters. Safe to render directly; no further truncation needed.
  """
  blockText: String!
}

"""
Semantic search hit where the matched object is a *Relationship*.

Surfaces ``OC_SUBTREE_GROUP`` rows (or, in the future, any embedded
relationship type) ranked by vector similarity. The doc viewer uses
``source_annotation_id`` + ``target_annotation_ids`` to scroll-and-select
the whole block in a single navigation, mirroring the existing
``RelationGroup`` selection flow.

ID convention
-------------
``relationship_id``, ``source_annotation_id``, ``target_annotation_ids``,
``document_id``, and ``corpus_id`` are ALL raw Django PKs (not Relay
global IDs). The frontend deep-link path consumes them directly without
``from_global_id``. Do NOT feed these values into resolvers that expect
a Relay global ID (e.g. ``node(id: $documentId)``) — they will silently
fail. Use the corresponding Relay-encoded type if you need that contract.
"""
type SemanticSearchRelationshipResultType {
  """
  Database PK of the Relationship. NOTE: this is the raw Django PK (matching ``Relationship.id``), NOT a global Relay ID — frontend deep-links and selection setters pass it through directly without ``from_global_id``.
  """
  relationshipId: ID!

  """Cosine similarity (0.0-1.0, higher is more similar)."""
  similarityScore: Float!

  """
  Relationship label text (e.g. ``OC_SUBTREE_GROUP``). Provided so callers can filter or branch on the relationship kind without a follow-up fetch.
  """
  label: String

  """
  PK of the (typically single) source annotation — the block's root. Null only when the relationship has no source row, which the materialiser does not produce but defensive frontends should still handle.
  """
  sourceAnnotationId: ID

  """PKs of the relationship's target annotations."""
  targetAnnotationIds: [ID!]!

  """
  Source + targets concatenated newline-separated, capped at ``SUBTREE_GROUP_BLOCK_TEXT_MAX_CHARS`` — the same string the embedder saw, suitable for snippet display.
  """
  blockText: String!

  """
  PK of the document this relationship is anchored to (or that shares the ``StructuralAnnotationSet`` for structural rows). Null when the relationship is global and not tied to any single document.
  """
  documentId: ID

  """
  PK of the corpus this relationship belongs to. Null for non-corpus relationships.
  """
  corpusId: ID
}

