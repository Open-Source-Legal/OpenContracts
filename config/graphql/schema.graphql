  deleteThread(
    """ID of thread to delete"""
    conversationId: ID!

    """Reason for deletion"""
    reason: String
  ): DeleteThreadMutation

  """
  Restore a soft-deleted thread.
  Only moderators or thread creators can restore threads.
  """
  restoreThread(
    """ID of thread to restore"""
    conversationId: ID!

    """Reason for restoration"""
    reason: String
  ): RestoreThreadMutation

  """
  Add a moderator to a corpus with specific permissions.
  Only corpus owners can add moderators.
  """
  addModerator(
    """ID of the corpus"""
    corpusId: String!

    """
    List of permissions: lock_threads, pin_threads, delete_messages, delete_threads
    """
    permissions: [String]!

    """ID of the user to add as moderator"""
    userId: String!
  ): AddModeratorMutation

  """
  Remove a moderator from a corpus.
  Only corpus owners can remove moderators.
  """
  removeModerator(
    """ID of the corpus"""
    corpusId: String!

    """ID of the user to remove as moderator"""
    userId: String!
  ): RemoveModeratorMutation

  """
  Update a moderator's permissions for a corpus.
  Only corpus owners can update moderator permissions.
  """
  updateModeratorPermissions(
    """ID of the corpus"""
    corpusId: String!

    """
    List of permissions: lock_threads, pin_threads, delete_messages, delete_threads
    """
    permissions: [String]!

    """ID of the moderator user"""
    userId: String!
  ): UpdateModeratorPermissionsMutation

  """
  Rollback a moderation action by executing its inverse.
  - delete_message -> restore_message
  - delete_thread -> restore_thread
  - lock_thread -> unlock_thread
  - pin_thread -> unpin_thread

  Only moderators with appropriate permissions can rollback.
  Creates a new ModerationAction record for the rollback.
  """
  rollbackModerationAction(
    """ID of action to rollback"""
    actionId: ID!

    """Reason for rollback"""
    reason: String
  ): RollbackModerationActionMutation

  """Mark a single notification as read."""
  markNotificationRead(
    """Notification ID to mark as read"""
    notificationId: ID!
  ): MarkNotificationReadMutation

  """Mark a single notification as unread."""
  markNotificationUnread(
    """Notification ID to mark as unread"""
    notificationId: ID!
  ): MarkNotificationUnreadMutation

  """Mark all of the current user's notifications as read."""
  markAllNotificationsRead: MarkAllNotificationsReadMutation

  """Delete a notification."""
  deleteNotification(
    """Notification ID to delete"""
    notificationId: ID!
  ): DeleteNotificationMutation

  """
  Update the singleton pipeline settings.

  Only superusers can modify these settings. Changes take effect immediately
  for all new document processing tasks.

  Arguments:
      preferred_parsers: Dict mapping MIME types to parser class paths
      preferred_embedders: Dict mapping MIME types to embedder class paths
      preferred_thumbnailers: Dict mapping MIME types to thumbnailer class paths
      preferred_enrichers: Dict mapping MIME types to ORDERED LISTS of enricher class paths
      parser_kwargs: Dict mapping parser class paths to their configuration kwargs
      component_settings: Dict mapping component class paths to settings overrides
      default_embedder: Default embedder class path

  Returns:
      ok: Whether the update succeeded
      message: Status message
      pipeline_settings: The updated settings
  """
  updatePipelineSettings(
    """Mapping of component class paths to settings overrides."""
    componentSettings: GenericScalar

    """
    Default embedder class path used for all ingest embedding. There is no MIME-specific override; see preferred_embedders.
    """
    defaultEmbedder: String

    """
    File converter class path used to convert non-native upload formats to PDF before parsing. Empty string disables the conversion step.
    """
    defaultFileConverter: String

    """
    Install-wide default LLM model spec (pydantic-ai '{provider}:{model}' form, e.g. 'anthropic:claude-opus-4-6') for agents when no per-corpus or per-agent override is set. Empty string falls back to the Django settings default. The provider prefix must be a registered LLM provider.
    """
    defaultLlm: String

    """
    Default post-retrieval reranker class path. Empty string disables reranking (first-stage vector / hybrid search only).
    """
    defaultReranker: String

    """
    List of enabled component class paths. Components assigned as filetype defaults must be included.
    """
    enabledComponents: [String]

    """
    Mapping of parser class paths to their configuration kwargs. Example: {'DoclingParser': {'force_ocr': true}}
    """
    parserKwargs: GenericScalar

    """
    Mapping of MIME types to preferred embedder class paths. API-only (issue #2114): has no effect at ingest, which always resolves the single global default_embedder to keep the cross-corpus vector index on one embedding space.
    """
    preferredEmbedders: GenericScalar

    """
    Mapping of MIME types to ordered lists of preferred enricher class paths.
    """
    preferredEnrichers: GenericScalar

    """
    Mapping of MIME types to preferred parser class paths. Example: {'application/pdf': 'opencontractserver.pipeline.parsers.docling_parser_rest.DoclingParser'}
    """
    preferredParsers: GenericScalar

    """Mapping of MIME types to preferred thumbnailer class paths."""
    preferredThumbnailers: GenericScalar
  ): UpdatePipelineSettingsMutation

  """
  Reset pipeline settings to Django settings defaults.

  This mutation resets all pipeline settings to their default values from
  Django settings (PREFERRED_PARSERS, PREFERRED_EMBEDDERS, etc.).

  Only superusers can perform this operation.
  """
  resetPipelineSettings: ResetPipelineSettingsMutation

  """
  Update encrypted secrets for a specific pipeline component.

  This mutation allows superusers to securely store API keys, tokens, and
  other credentials for pipeline components. The secrets are encrypted at
  rest using Fernet symmetric encryption.

  Only superusers can perform this operation.

  Arguments:
      component_path: Full class path of the component (e.g.,
          'opencontractserver.pipeline.parsers.llamaparse_parser.LlamaParseParser')
      secrets: Dict of secret key-value pairs to store (e.g., {'api_key': '...'})
      merge: If True, merge with existing secrets. If False, replace all secrets
          for this component. Default: True

  Returns:
      ok: Whether the update succeeded
      message: Status message
      components_with_secrets: List of component paths that have secrets stored
  """
  updateComponentSecrets(
    """Full class path of the component."""
    componentPath: String!

    """
    If True, merge with existing secrets. If False, replace all secrets for this component.
    """
    merge: Boolean = true

    """
    Dict of secret key-value pairs to store. Example: {'api_key': 'sk-...', 'secret_token': '...'}
    """
    secrets: GenericScalar!
  ): UpdateComponentSecretsMutation

  """
  Delete all encrypted secrets for a specific pipeline component.

  Only superusers can perform this operation.

  Arguments:
      component_path: Full class path of the component

  Returns:
      ok: Whether the deletion succeeded
      message: Status message
      components_with_secrets: Updated list of component paths that have secrets
  """
  deleteComponentSecrets(
    """Full class path of the component."""
    componentPath: String!
  ): DeleteComponentSecretsMutation

  """
  Update encrypted secrets for an agent tool (e.g. web search API keys).

  Tool secrets are stored in PipelineSettings alongside component secrets,
  under a ``tool:`` namespace prefix. Only superusers can perform this.

  Arguments:
      tool_key: Tool identifier, e.g. ``"tool:web_search"``
      secrets: Dict of secret key-value pairs, e.g. ``{"api_key": "..."}``
      settings: Optional non-sensitive settings, e.g. ``{"provider": "brave"}``
      merge: If True (default), merge with existing; if False, replace.
  """
  updateToolSecrets(
    """If True, merge with existing. If False, replace."""
    merge: Boolean = true

    """Dict of secret values to encrypt (e.g. api_key)."""
    secrets: GenericScalar = null

    """Dict of non-sensitive settings (e.g. provider)."""
    settings: GenericScalar = null

    """Tool identifier, e.g. "tool:web_search"."""
    toolKey: String!
  ): UpdateToolSecretsMutation

  """
  Delete all settings and secrets for an agent tool.

  Only superusers can perform this operation.
  """
  deleteToolSecrets(
    """Tool identifier, e.g. "tool:web_search"."""
    toolKey: String!
  ): DeleteToolSecretsMutation

  """Kick off a deep-research job over a corpus (explicit, non-chat path)."""
  startResearchReport(corpusId: ID!, corpusGroupId: ID, maxSteps: Int, prompt: String!, title: String): StartResearchReport

  """Request cooperative cancellation of an in-flight research job."""
  cancelResearchReport(id: ID!): CancelResearchReport

  """
  Smart mutation that handles label search and creation with automatic labelset management.

  This mutation encapsulates the following logic:
  1. If no labelset exists for the corpus and createIfNotFound is true:
     - Creates a new labelset
     - Assigns it to the corpus
     - Creates the label in the new labelset

  2. If labelset exists:
     - Searches for existing labels matching the search term
     - If matches found: returns the matching labels
     - If no matches and createIfNotFound is true: creates the label
     - If no matches and createIfNotFound is false: returns empty list
  """
  smartLabelSearchOrCreate(
    """Color for new label (if created)"""
    color: String = "#1a75bc"

    """ID of the corpus to work with"""
    corpusId: String!

    """Whether to create label/labelset if not found"""
    createIfNotFound: Boolean = false

    """Description for new label (if created)"""
    description: String = ""

    """Icon for new label (if created)"""
    icon: String = "tag"

    """The type of label (SPAN_LABEL, TOKEN_LABEL, etc.)"""
    labelType: String!

    """Description for new labelset (if created)"""
    labelsetDescription: String = ""

    """
    Title for new labelset (if created). Defaults to corpus title + ' Labels'
    """
    labelsetTitle: String

    """The label text to search for or create"""
    searchTerm: String!
  ): SmartLabelSearchOrCreateMutation

  """
  Simplified mutation to get all available labels for a corpus with helpful status info.
  """
  smartLabelList(
    """ID of the corpus"""
    corpusId: String!

    """Optional filter by label type"""
    labelType: String
  ): SmartLabelListMutation
  tokenAuth(username: String!, password: String!): ObtainJSONWebTokenWithUser

  """Update basic profile fields for the current user, including slug."""
  updateMe(firstName: String, isProfilePublic: Boolean, lastName: String, name: String, phone: String, profileAboutMarkdown: String, profileHeadline: String, profileLinksMarkdown: String, slug: String): UpdateMe
  acceptCookieConsent: AcceptCookieConsent

  """Mutation to dismiss the getting-started guide for the current user."""
  dismissGettingStarted: DismissGettingStarted

  """
  Create or update a vote on a message.
  Users can upvote or downvote messages. Changing vote type updates the existing vote.
  Users cannot vote on their own messages.
  """
  voteMessage(
    """ID of the message to vote on"""
    messageId: String!

    """Vote type: 'upvote' or 'downvote'"""
    voteType: String!
  ): VoteMessageMutation

  """Remove user's vote from a message."""
  removeVote(
    """ID of the message to remove vote from"""
    messageId: String!
  ): RemoveVoteMutation

  """
  Create or update a vote on a conversation/thread.
  Users can upvote or downvote threads. Changing vote type updates the existing vote.
  Users cannot vote on their own threads.

  Permission: Users can vote on any conversation/thread they can see (visibility-based).
  """
  voteConversation(
    """ID of the conversation/thread to vote on"""
    conversationId: String!

    """Vote type: 'upvote' or 'downvote'"""
    voteType: String!
  ): VoteConversationMutation

  """
  Remove user's vote from a conversation/thread.

  Permission: Users can remove their vote from any conversation they can see.
  """
  removeConversationVote(
    """ID of the conversation/thread to remove vote from"""
    conversationId: String!
  ): RemoveConversationVoteMutation

  """
  Create or update a vote on a corpus.

  Authenticated users vote with their account; the service blocks self-vote
  (creators cannot upvote their own corpuses, matching the Message /
  Conversation contract). Anonymous viewers vote via their Django session
  key — one vote per session per corpus. Anonymous voting on a non-public
  corpus is rejected by the same IDOR-safe "not found or no permission"
  response as a malformed corpus id.
  """
  voteCorpus(
    """Relay global ID of the corpus to vote on"""
    corpusId: String!

    """Vote type: 'upvote' or 'downvote'"""
    voteType: String!
  ): VoteCorpusMutation

  """
  Remove the caller's vote on a corpus.

  Symmetric with :class:`VoteCorpusMutation` — works for both
  authenticated users (creator-keyed) and anonymous viewers
  (session-keyed). Idempotent: removing a non-existent vote is a
  successful no-op rather than an error.
  """
  removeCorpusVote(
    """Relay global ID of the corpus to remove the vote from"""
    corpusId: String!
  ): RemoveCorpusVoteMutation

  """Create a new worker service account. Superuser only."""
  createWorkerAccount(description: String = "", name: String!): CreateWorkerAccount

  """
  Deactivate a worker account (revokes all its tokens implicitly). Superuser only.
  """
  deactivateWorkerAccount(workerAccountId: Int!): DeactivateWorkerAccount

  """Reactivate a previously deactivated worker account. Superuser only."""
  reactivateWorkerAccount(workerAccountId: Int!): ReactivateWorkerAccount

  """
  Create a scoped access token granting a worker upload access to a corpus.

  Returns the full token key — it is only shown once.
  Allowed for superusers and the corpus creator.
  """
  createCorpusAccessToken(corpusId: Int!, expiresAt: DateTime = null, rateLimitPerMinute: Int = 0, workerAccountId: Int!): CreateCorpusAccessTokenMutation

  """
  Revoke a corpus access token. Allowed for superusers and the corpus creator.
  """
  revokeCorpusAccessToken(tokenId: Int!): RevokeCorpusAccessTokenMutation
}

