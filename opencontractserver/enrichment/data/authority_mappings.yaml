# Authority mappings — canonical source of truth.
# Loaded idempotently by AuthorityMappingLoader (manage.py load_authority_mappings):
#   prefixes:     -> AuthorityNamespace registry rows (global) + the in-memory
#                    AUTHORITY_PREFIX / PREFIX_CLASSIFICATION / PREFIX_DISPLAY_NAME
#                    maps in enrichment.constants (derived at import).
#   equivalences: -> AuthorityKeyEquivalence rows tagged source="baseline".
#   rewrite_rules:-> sparing, reviewed prefix transforms evaluated as a FALLBACK
#                    after explicit per-key equivalences (preview before going live:
#                    manage.py preview_rewrite_rule).
#
# Editing this file then re-running the loader is the supported way to add an
# authority body / equivalence — no code, migration, or deploy required.

# --- Authority bodies (namespace registry + classification) -------------------
# prefix -> {display_name, jurisdiction, authority_type, aliases}. Shape-scoped
# families (usc-NN, cfr-NN, fedreg, act/publ/stat) are classified dynamically by
# constants.classify_prefix and intentionally NOT listed here.
prefixes:
  dgcl:
    display_name: "Delaware General Corporation Law"
    jurisdiction: "us-de"
    authority_type: "statute"
    aliases: ["delaware general corporation law", "dgcl"]
  securities-act:
    display_name: "Securities Act of 1933"
    jurisdiction: "us-federal"
    authority_type: "statute"
    aliases: ["securities act"]
  exchange-act:
    display_name: "Securities Exchange Act of 1934"
    jurisdiction: "us-federal"
    authority_type: "statute"
    aliases: ["securities exchange act", "exchange act"]
  irc:
    display_name: "Internal Revenue Code"
    jurisdiction: "us-federal"
    authority_type: "statute"
    aliases: ["internal revenue code"]
  ica:
    display_name: "Investment Company Act of 1940"
    jurisdiction: "us-federal"
    authority_type: "statute"
    aliases: ["investment company act"]
  iaa:
    display_name: "Investment Advisers Act of 1940"
    jurisdiction: "us-federal"
    authority_type: "statute"
    aliases: ["investment advisers act"]
  sec-rule:
    display_name: "SEC Rules (17 C.F.R.)"
    jurisdiction: "us-federal"
    authority_type: "regulation"
    aliases: []
  # HTS tariff-code citations ("subheading 3924.90.5650, HTSUS") are emitted by
  # the Tier-2a customs grammar (enrichment/grammars.py) rather than by these
  # Tier-1 aliases; the entry classifies/names the prefix and seeds its
  # AuthorityNamespace row. Enacted as statute (19 U.S.C. § 1202 note).
  htsus:
    display_name: "Harmonized Tariff Schedule of the United States"
    jurisdiction: "us-federal"
    authority_type: "statute"
    aliases:
      [
        "harmonized tariff schedule of the united states",
        "harmonized tariff schedule",
        "htsus",
      ]

# --- Key equivalences (act-section <-> USC/CFR codification) ------------------
# from_key = popular-name act citation filings use; to_key = USC/CFR codification
# the provider materialises. find_authority_target queries both columns.
equivalences:
  # Securities Exchange Act of 1934 (15 U.S.C. Chapter 2B)
  - { from_key: "exchange-act:9", to_key: "usc-15:78i" }
  - { from_key: "exchange-act:10", to_key: "usc-15:78j" }
  - { from_key: "exchange-act:12", to_key: "usc-15:78l" }
  - { from_key: "exchange-act:13", to_key: "usc-15:78m" }
  - { from_key: "exchange-act:14", to_key: "usc-15:78n" }
  - { from_key: "exchange-act:14a", to_key: "usc-15:78n" }
  - { from_key: "exchange-act:16", to_key: "usc-15:78p" }
  - { from_key: "exchange-act:17", to_key: "usc-15:78q" }
  - { from_key: "exchange-act:20", to_key: "usc-15:78t" }
  - { from_key: "exchange-act:21", to_key: "usc-15:78u" }
  # Securities Act of 1933 (15 U.S.C. Chapter 2A)
  - { from_key: "securities-act:2", to_key: "usc-15:77b" }
  - { from_key: "securities-act:3", to_key: "usc-15:77c" }
  - { from_key: "securities-act:4", to_key: "usc-15:77d" }
  - { from_key: "securities-act:5", to_key: "usc-15:77e" }
  - { from_key: "securities-act:7", to_key: "usc-15:77g" }
  - { from_key: "securities-act:10", to_key: "usc-15:77j" }
  - { from_key: "securities-act:11", to_key: "usc-15:77k" }
  - { from_key: "securities-act:12", to_key: "usc-15:77l" }
  - { from_key: "securities-act:15", to_key: "usc-15:77o" }
  # Internal Revenue Code = Title 26 U.S.C. (mechanical: irc:N -> usc-26:N)
  - { from_key: "irc:401", to_key: "usc-26:401", note: "IRC is Title 26 USC" }
  - { from_key: "irc:414", to_key: "usc-26:414", note: "IRC is Title 26 USC" }
  # Exchange Act extras
  - { from_key: "exchange-act:15", to_key: "usc-15:78o" }
  - { from_key: "exchange-act:10d", to_key: "usc-15:78j-4", note: "Dodd-Frank clawback" }
  # SEC Exchange-Act rules live in 17 CFR 240. DO NOT add sec-rule:5121 (FINRA) or
  # sec-rule:457 (17 CFR 230) — they are NOT in 17 CFR 240.
  - { from_key: "sec-rule:13d-3", to_key: "cfr-17:240.13d-3" }
  - { from_key: "sec-rule:13d-5", to_key: "cfr-17:240.13d-5" }
  - { from_key: "sec-rule:10a-3", to_key: "cfr-17:240.10a-3" }
  - { from_key: "sec-rule:16b-3", to_key: "cfr-17:240.16b-3" }
  - { from_key: "sec-rule:14a-19", to_key: "cfr-17:240.14a-19" }

# --- Prefix rewrite rules (sparing, reviewed mechanical transforms) -----------
# Regex pattern -> replacement, evaluated as a FALLBACK in _provider_for and
# find_authority_target AFTER explicit per-key equivalences (an explicit row
# always wins). Use only for genuinely mechanical 1:1 codifications, and verify
# coverage first: `manage.py preview_rewrite_rule`.
# NOTE: `sec-rule` is deliberately EXCLUDED — its sections split across 17 CFR
# 240/230 and FINRA (a taxonomy follow-up, not a mechanical rewrite).
rewrite_rules:
  # The Internal Revenue Code IS Title 26 U.S.C.: section numbers align 1:1, so
  # any irc:N resolves to usc-26:N. The explicit irc:401/irc:414 baseline rows
  # above still win for those keys; this generalises to every other IRC section.
  - pattern: '^irc:(?P<n>.+)$'
    replacement: 'usc-26:\g<n>'
    note: "Internal Revenue Code is Title 26 U.S.C. (sections align 1:1)"
