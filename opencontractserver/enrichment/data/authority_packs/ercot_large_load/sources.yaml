  # ERCOT's current-library pages contain global navigation as well as the
  # documents. The title+URL filters keep only the relevant rule attachments.
  - id: "ercot-planning-section-9-discovery"
    ingestion_mode: "full_content"
    corpus_slug: "ercot-current-large-load-rules"
    discovery_provider: "ERCOTGuideLibraryDiscoveryProvider"
    source_provider: "ERCOTGuideAuthoritySourceProvider"
    metadata:
      authority_family: "ercot-market-rule"
      instrument_type: "PLANNING_GUIDE"
      publisher: "Electric Reliability Council of Texas"
      jurisdiction: "us-tx-ercot"
      status: "CURRENT"
      authority_weight: "CONTROLLING"
    index_urls:
      - "https://www.ercot.com/mktrules/guides/planning/current"
    discovery_kwargs:
      max_candidates: 500
    candidate_filters:
      include_title:
        - '^Section 9\b'
      include_url:
        - '^https://www\.ercot\.com/files/docs/.+\.(?:docx?|pdf)$'

