  # Preserve every numbered official attachment as its own full-content record.
  # Exact root URLs are allowed; fragment-only page navigation is excluded.
  - id: "ercot-large-load-revision-discovery"
    ingestion_mode: "full_content"
    corpus_slug: "ercot-large-load-revision-history"
    discovery_provider: "ERCOTIssueIndexDiscoveryProvider"
    source_provider: "ERCOTIssueAuthoritySourceProvider"
    metadata:
      authority_family: "ercot-revision-request"
      instrument_type: "STAFF_MEMO"
      publisher: "Electric Reliability Council of Texas"
      jurisdiction: "us-tx-ercot"
      status: "FILED"
      authority_weight: "EVIDENTIARY"
    index_urls:
      - "https://www.ercot.com/mktrules/issues/PGRR115"
      - "https://www.ercot.com/mktrules/issues/PGRR145"
      - "https://www.ercot.com/mktrules/issues/NPRR1325"
    discovery_kwargs:
      max_candidates: 500
    candidate_filters:
      include_url:
        - '^https://www\.ercot\.com/mktrules/issues/(?:PGRR115|PGRR145|NPRR1325)$'
        - >-
          ^https://www\.ercot\.com/files/docs/.+/(?:115PGRR|145PGRR|1325NPRR)-

