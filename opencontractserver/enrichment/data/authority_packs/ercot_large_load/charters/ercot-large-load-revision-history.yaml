  - "PGRR 115, PGRR 145, NPRR 1325, and later approved scope additions"
  - "sponsor submissions, comments, impact analyses, and committee records"
  - "TAC, Board, and PUCT reports and approvals"
exclude:
  - "current consolidated rule text except for before-and-after comparison"
  - "materials unrelated to the identified revision request"
  - "duplicate attachments with the same official identifier and content hash"
authority_tiers:
  default: "EVIDENTIARY"
  approved_and_effective_revision: "CONTROLLING"
  stakeholder_comment: "ADVOCACY"
update_expectation: "daily_while_active_then_event_driven"
current_as_of: "2026-07-25"
approval_status: "pending_legal_review"
legal_owner: null
technical_owner: null
