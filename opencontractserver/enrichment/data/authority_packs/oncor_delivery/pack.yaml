schema_version: 2
name: "oncor_delivery"
display_name: "Oncor Delivery"
description: >
  Oncor's PUCT-approved delivery tariff, tariff history, regulatory filings,
  and official service and construction requirements.
jurisdiction: "us-tx-oncor"
mappings: "authority_mappings.oncor_delivery.yaml"
metadata_schema: "metadata/authority_source_record.yaml"
relationships: "relationships.yaml"
sources: "sources.yaml"
source_hosts:
  - "oncor.com"
corpora:
  - slug: "oncor-current-delivery-tariff"
    title: "Oncor Current Delivery Tariff"
    # ``oncor-tariff`` binds here rather than to the history corpus: a prefix
    # may bind to exactly one corpus, and prior tariff versions are historical
    # records of this same authority. The history corpus's lineage edges
    # (EFFECTIVE_VERSION_OF / SUPERSEDED_BY) are declared in relationships.yaml,
    # so nothing depends on binding the prefix there.
    authority_prefixes:
      - "oncor-tariff"
      - "oncor-rider"
    description: >
      The current PUCT-approved Oncor tariff, applicable schedules, riders,
      service charges, and incorporated agreements.
    charter: "charters/oncor-current-delivery-tariff.yaml"
    spec: "specs/oncor-current-delivery-tariff.json"
    persona: "personas/oncor-current-delivery-tariff.txt"
    metadata_schema: "metadata/authority_source_record.yaml"
    default_authority_weight: "CONTROLLING"
  - slug: "oncor-tariff-history"
    title: "Oncor Tariff History and Regulatory Filings"
    description: >
      Prior tariff versions, PUCT approval records, and selected filings needed
      to trace changes and cost responsibility.
    charter: "charters/oncor-tariff-history-and-regulatory-filings.yaml"
    spec: "specs/oncor-tariff-history-and-regulatory-filings.json"
    persona: "personas/oncor-tariff-history-and-regulatory-filings.txt"
    metadata_schema: "metadata/authority_source_record.yaml"
    default_authority_weight: "EVIDENTIARY"
  - slug: "oncor-service-requirements"
    title: "Oncor Service and Construction Requirements"
    authority_prefixes:
      - "oncor-service-guide"
    description: >
      Official Oncor technical guidelines, construction standards, metering
      requirements, application forms, and customer responsibilities.
    charter: "charters/oncor-service-and-construction-requirements.yaml"
    spec: "specs/oncor-service-and-construction-requirements.json"
    persona: "personas/oncor-service-and-construction-requirements.txt"
    metadata_schema: "metadata/authority_source_record.yaml"
    default_authority_weight: "IMPLEMENTING"
