version: 1
fields:
  - name: "authority_family"
    data_type: "STRING"
    help_text: "Publisher-specific authority family used for research ranking."
    validation_config: {required: true}
  - name: "instrument_type"
    data_type: "CHOICE"
    help_text: "Domain-specific document type; does not expand core authority_type."
    validation_config:
      required: true
      choices: ["STATUTE", "REGULATION", "FINAL_ORDER", "TARIFF", "PROTOCOL", "PLANNING_GUIDE", "OPERATING_GUIDE", "REVISION_REQUEST", "MARKET_NOTICE", "FORM", "ATTESTATION", "FAQ", "STAFF_MEMO", "TESTIMONY", "COMMENT", "TRANSCRIPT", "FILING", "MUNICIPAL_ORDINANCE", "TECHNICAL_GUIDE"]
  - {name: "publisher", data_type: "STRING", validation_config: {required: true}}
  - {name: "jurisdiction", data_type: "STRING", validation_config: {required: true}}
  - {name: "canonical_key", data_type: "STRING", validation_config: {required: true}}
  - {name: "source_identifier", data_type: "STRING", validation_config: {required: true}}
  - {name: "source_url", data_type: "URL", validation_config: {required: true}}
  - {name: "parent_proceeding", data_type: "STRING", validation_config: {required: false}}
  - {name: "filed_date", data_type: "DATE", validation_config: {required: false}}
  - {name: "issued_date", data_type: "DATE", validation_config: {required: false}}
  - {name: "published_date", data_type: "DATE", validation_config: {required: false}}
  - {name: "effective_from", data_type: "DATE", validation_config: {required: false}}
  - {name: "effective_until", data_type: "DATE", validation_config: {required: false}}
  - name: "effective_date_review_status"
    data_type: "CHOICE"
    help_text: "Explicit review state when a current authority has no stated effective date."
    validation_config: {required: false, choices: ["UNKNOWN_NEEDS_REVIEW"]}
  - name: "status"
    data_type: "STRING"
    help_text: "Lifecycle status from the shared SourceStatus vocabulary."
    validation_config: {required: true}
  - name: "authority_weight"
    data_type: "CHOICE"
    validation_config:
      required: true
      choices: ["CONTROLLING", "IMPLEMENTING", "INTERPRETIVE", "EVIDENTIARY", "ADVOCACY", "INFORMAL"]
  - {name: "current_version", data_type: "BOOLEAN", validation_config: {required: false}}
  - {name: "version_label", data_type: "STRING", validation_config: {required: false}}
  - {name: "supersedes_key", data_type: "STRING", validation_config: {required: false}}
  - {name: "superseded_by_key", data_type: "STRING", validation_config: {required: false}}
  - {name: "adopts_key", data_type: "STRING", validation_config: {required: false}}
  - {name: "rejects_key", data_type: "STRING", validation_config: {required: false}}
  - {name: "amends_key", data_type: "STRING", validation_config: {required: false}}
  - {name: "retrieved_at", data_type: "DATETIME", validation_config: {required: true}}
  - {name: "content_hash", data_type: "STRING", validation_config: {required: true}}
  - {name: "source_mime_type", data_type: "STRING", validation_config: {required: true}}
