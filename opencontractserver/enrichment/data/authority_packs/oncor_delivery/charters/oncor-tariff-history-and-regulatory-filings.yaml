title: "Oncor Tariff History and Regulatory Filings"
slug: "oncor-tariff-history"
purpose: >
  Preserve prior tariff versions and the PUCT record needed to explain material
  tariff changes and cost responsibility.
include:
  - "prior official tariff versions, beginning with Revision Twenty effective November 27, 2017"
  - "PUCT orders approving material tariff changes"
  - "selected rate-case filings and large-load tariff proposals"
  - "testimony necessary to understand cost responsibility"
exclude:
  - "current tariff copies already curated in the current-tariff corpus"
  - "unrelated rate-case filings"
  - "duplicates with identical official identifiers and content hashes"
  - "synthetic or inferred tariff-version identities"
authority_tiers:
  default: "EVIDENTIARY"
  final_order: "CONTROLLING"
  utility_testimony: "ADVOCACY"
update_expectation: "event_driven"
current_as_of: "2026-07-25"
approval_status: "pending_legal_review"
legal_owner: null
technical_owner: null
