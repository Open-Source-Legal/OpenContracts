schema_version: 2
name: "puct_electric"
display_name: "Public Utility Commission of Texas — Electric"
description: >
  PUCT electric substantive rules, controlling orders, and large-load
  proceedings, curated with explicit authority weight and lifecycle metadata.
jurisdiction: "us-tx"
mappings: "authority_mappings.puct_electric.yaml"
metadata_schema: "metadata/authority_source_record.yaml"
relationships: "relationships.yaml"
sources: "sources.yaml"
source_hosts:
  - "puc.texas.gov"
corpora:
  - slug: "puct-electric-rules-and-orders"
    title: "PUCT Electric Rules and Controlling Orders"
    # See the note in ercot_large_load/pack.yaml: unbound prefixes make the
    # importer skip authority reconciliation for the whole corpus.
    authority_prefixes:
      - "tx-admin-puct"
      - "puct-order"
    description: >
      Current Chapter 25 rules and final PUCT orders with operative effect on
      electric large-load service.
    charter: "charters/puct-electric-rules-and-controlling-orders.yaml"
    spec: "specs/puct-electric-rules-and-controlling-orders.json"
    persona: "personas/puct-electric-rules-and-controlling-orders.txt"
    metadata_schema: "metadata/authority_source_record.yaml"
    default_authority_weight: "CONTROLLING"
  - slug: "puct-large-load-proceedings"
    title: "PUCT Large-Load Proceedings"
    authority_prefixes:
      - "puct-project"
    description: >
      PUCT project and docket materials that explain proposed, pending, and
      adopted large-load policy without silently outranking final authorities.
    charter: "charters/puct-large-load-proceedings.yaml"
    spec: "specs/puct-large-load-proceedings.json"
    persona: "personas/puct-large-load-proceedings.txt"
    metadata_schema: "metadata/authority_source_record.yaml"
    default_authority_weight: "EVIDENTIARY"
