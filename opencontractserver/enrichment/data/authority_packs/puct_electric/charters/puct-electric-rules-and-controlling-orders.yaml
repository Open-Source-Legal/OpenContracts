title: "PUCT Electric Rules and Controlling Orders"
slug: "puct-electric-rules-and-orders"
purpose: >
  Provide current PUCT electric substantive rules and final orders with
  operative effect on large-load interconnection and delivery service.
include:
  - "applicable Chapter 25 substantive rules"
  - "procedural provisions necessary to understand waivers and exceptions"
  - "final orders approving relevant ERCOT revisions or utility tariffs"
  - "declaratory orders that materially interpret large-load requirements"
exclude:
  - "proposed rules and unadopted recommendations"
  - "party filings, comments, testimony, and draft orders"
  - "superseded rule text except as explicit version history"
authority_tiers:
  default: "CONTROLLING"
update_expectation: "event_driven"
current_as_of: "2026-07-25"
approval_status: "pending_legal_review"
legal_owner: null
technical_owner: null
