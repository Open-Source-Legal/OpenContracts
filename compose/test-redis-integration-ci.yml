services:
  # Override django to remove ML service dependencies.
  # Redis integration tests only need postgres + redis.
  django:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Stub out ML services so they don't start
  vector-embedder:
    extends:
      file: compose/compose.images.yml
      service: ci-stub
    command: "true"
  multimodal-embedder:
    extends:
      file: compose/compose.images.yml
      service: ci-stub
    command: "true"
  docling-parser:
    extends:
      file: compose/compose.images.yml
      service: ci-stub
    command: "true"
  celeryworker:
    extends:
      file: compose/compose.images.yml
      service: ci-stub
    command: "true"
