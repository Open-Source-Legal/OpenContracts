codecov:
  require_ci_to_pass: yes
  notify:
    # Wait for all 4 coverage uploads (backend, frontend-unit,
    # frontend-component, frontend-e2e) before sending notifications.
    # Carryforward flags count towards this threshold, so partial
    # workflow runs (e.g. backend-only PRs) still satisfy it.
    after_n_builds: 4
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        # Don't post project status until all 4 uploads have arrived.
        # Without this, Codecov posts after the first upload with
        # incomplete data, causing main to report stale coverage.
        after_n_builds: 4
    patch:
      default:
        after_n_builds: 4
    changes: false

flags:
  backend:
    paths:
      - opencontractserver/
      - config/
    carryforward: true
  frontend-unit:
    paths:
      - frontend/src/
    carryforward: true
  frontend-component:
    paths:
      - frontend/src/
    carryforward: true
  frontend-e2e:
    paths:
      - frontend/src/
    carryforward: true

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: no
  after_n_builds: 4

ignore:
  - "opencontractserver/tasks/data_extract_tasks.py"
  - "opencontractserver/tests/**"
  - "**/migrations/**"
  - "opencontractserver/**/migrations/*.py"
  - "opencontractserver/*/migrations/*.py"
  - "config/settings/test*.py"
  - "frontend/src/**/*.test.{ts,tsx}"
  - "frontend/src/setupTests.ts"
  - "frontend/tests/**"
  - "frontend/*.config.ts"
