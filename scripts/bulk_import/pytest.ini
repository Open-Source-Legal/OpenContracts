[pytest]
# Standalone, pure-Python tests for the bulk-import CLI — no Django, no Docker.
# A local pytest.ini makes scripts/bulk_import the rootdir so the repo-root
# conftest.py (which wires Django / pytest-django db fixtures) is not loaded
# for these tests, and disables the pytest-django plugin outright.
addopts = -p no:django -p no:cacheprovider -q
testpaths = tests
