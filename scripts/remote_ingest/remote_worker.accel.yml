# Common, CPU-safe image override for the remote-ingest worker bundle.
#
# Merge this after remote_worker.yml, then merge one vendor overlay from
# compose/accelerated/ after it. For example, from scripts/remote_ingest:
#
#   docker compose \
#     -f remote_worker.yml \
#     -f remote_worker.accel.yml \
#     -f ../../compose/accelerated/accel.nvidia.yml up -d --build
#
# The vendor overlays contain no build-context paths, so the same files are
# reusable by the local stack and this remote bundle. This common file has no
# device mounts and is therefore safe on a CPU-only host.

services:
  docling-parser:
    image: oc-docling:cpu
    build:
      context: ../../compose/accelerated
      dockerfile: docling/Dockerfile
      args:
        ACCEL: cpu
    environment:
      DOCLING_ACCEL: ${DOCLING_ACCEL:-auto}

  vector-embedder:
    image: oc-embedder:cpu
    build:
      context: ../../compose/accelerated
      dockerfile: embedder/Dockerfile
      args:
        ACCEL: cpu
    environment:
      EMBED_ACCEL: ${EMBED_ACCEL:-auto}
      VECTOR_EMBEDDER_API_KEY: ${VECTOR_EMBEDDER_API_KEY:-abc123}
